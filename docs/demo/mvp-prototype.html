<style>

g:8px 11px;width:190px;color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;display:grid;place-items:center;background:#e5ebff;color:#315bd0;border-radius:50%;font-weight:800}.content{padding:28px 32px 44px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:850;margin-bottom:5px}.pagehead h1{font-size:26px;line-height:1.2;letter-spacing:-.035em;margin:0 0 8px}.sub{color:var(--muted);margin:0;max-width:760px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:700;font-size:12px;box-shadow:0 1px 1px #15244206}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.ghost{background:transparent}.btn.disabled{border-style:dashed}.btn:focus-visible,.nav button:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);min-width:0}.statlabel{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.statvalue{font-size:28px;font-weight:800;letter-spacing:-.04em;margin:10px 0 4px}.statnote{font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--blue);margin-right:5px}.dot.green{background:var(--green)}.dot.amber{background:#d79a16}.dot.red{background:var(--red)}.twocol{grid-template-columns:minmax(0,1.45fr) minmax(290px,.85fr)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.cardhead h2{font-size:15px;margin:0;letter-spacing:-.02em}.muted{color:var(--muted)}.small{font-size:11px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:#fafbfe}th,td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr.clickrow{cursor:pointer}tbody tr.clickrow:hover{background:#f7f9ff}.link{color:var(--blue);font-weight:750;cursor:pointer}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:800;white-space:nowrap}.bblue{background:var(--blue2);color:#3159bd}.bgreen{background:var(--greenbg);color:var(--green)}.bamber{background:var(--amberbg);color:var(--amber)}.bred{background:var(--redbg);color:var(--red)}.bgray{background:#f0f2f6;color:#596579}.timeline{display:grid;gap:0}.step{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:18px}.step:not(:last-child):before{content:"";position:absolute;left:14px;top:29px;bottom:0;border-left:1px solid #dce3f1}.stepicon{width:29px;height:29px;border:1px solid #dce4f2;background:#f8faff;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:12px;z-index:1}.step strong{display:block;font-size:12px;margin:3px 0}.step p{margin:0;color:var(--muted);font-size:11px}.callout{padding:12px 13px;border-radius:9px;background:#f6f8ff;border:1px solid #e0e7ff;color:#455573;font-size:11px}.callout.warn{background:#fff9e9;border-color:#f5e4ae;color:#785c1a}.sectiontitle{font-size:14px;margin:0 0 13px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:750;color:#536078}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ed;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8ba8fa;box-shadow:0 0 0 3px #3569e81a}.full{grid-column:1/-1}.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-bottom:2px solid transparent;white-space:nowrap;font-size:12px;font-weight:750}.tabs button.active{color:var(--blue);border-color:var(--blue)}.candidategrid{grid-template-columns:repeat(3,minmax(0,1fr))}.candidate{border:1px solid var(--line);border-radius:11px;padding:15px;background:white;display:flex;flex-direction:column;gap:12px}.candidate.selected{border-color:#8ba8fa;box-shadow:0 0 0 2px #3569e812}.candtop{display:flex;justify-content:space-between;gap:8px}.candtitle{font-weight:800;font-size:13px;line-height:1.4}.score{font-size:23px;font-weight:850;letter-spacing:-.04em}.metric{display:grid;gap:5px}.metricrow{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.bar{height:5px;background:#edf0f6;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;background:#6f90f1;border-radius:6px}.candbottom{border-top:1px solid var(--line);padding-top:10px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kv div{padding:12px;border:1px solid var(--line);border-radius:9px}.kv span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.kv strong{font-size:12px}.empty{padding:36px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;z-index:20;background:#15213a;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px #0002;max-width:360px;font-size:12px;display:none}.toast.show{display:block;animation:pop .2s ease}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.modalback{position:fixed;inset:0;background:#111b2d70;display:none;align-items:center;justify-content:center;padding:18px;z-index:15}.modalback.open{display:flex}.modal{background:white;border-radius:14px;padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px #07122645}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0;font-size:18px}.close{border:0;background:#f0f3f8;border-radius:8px;width:32px;height:32px;font-size:18px}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:20px;padding:5px 9px;font-size:10px;color:var(--muted)}.audit{display:grid;grid-template-columns:100px 1fr 120px;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}.audit:last-child{border-bottom:0}.hidden{display:none!important}
@media(max-width:1000px){.app{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:20px 9px}.brand{padding:0 8px}.brandtext,.navlabel,.navtext,.sidefoot{display:none}.nav button{justify-content:center;padding:12px 6px}.nav .ico{font-size:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.candidategrid{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:620px){.topbar{height:60px}.search{display:none}.pagehead{display:block}.pagehead .actions{margin-top:14px}.pagehead h1{font-size:23px}.stats{gap:9px}.card{padding:14px}.fieldgrid{grid-template-columns:1fr}.full{grid-column:auto}.kv{grid-template-columns:1fr}.audit{grid-template-columns:75px 1fr}.audit span:last-child{grid-column:2}.content{padding:18px 12px}.statvalue{font-size:24px}}

<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">M</div><div class="brandtext"><strong>MANG <span style="color:#9eb8ff">/ 03</span></strong><small>Decision workspace</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span><span class="navtext">Home</span></button>
  <button data-page="issue"><span class="ico">◎</span><span class="navtext">Issue</span></button>
  <button data-page="solution"><span class="ico">◇</span><span class="navtext">Solution</span></button>
  <button data-page="decision"><span class="ico">⇄</span><span class="navtext">Decision &amp; Actions</span></button>
  <button data-page="outcome"><span class="ico">↗</span><span class="navtext">Outcomes &amp; Learning</span></button>
 </nav></div>
 <div><div class="navlabel">Administration</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span><span class="navtext">Settings</span></button></nav></div>
 <div class="sidefoot"><span class="demo-pill">● SYNTHETIC DEMO</span><p>Prototype only<br>Local state · No ERP connection</p></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">MANG_03 <span style="padding:0 7px">/</span> <strong id="crumb">Home</strong></div><div class="topright"><span class="demo-pill" style="background:#fff4d9;color:#916400;border-color:#f0dca4">DEMO DATA</span><input id="caseSearch" class="search" type="search" placeholder="Search demo cases..." aria-label="Search demo cases"><div class="avatar" title="Demo manager">DM</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modalback" id="modalback" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modalhead"><h2 id="modalTitle">New issue intake</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><form id="intakeForm"><div class="fieldgrid">
<div class="field full"><label for="title">Issue title *</label><input id="title" required placeholder="Describe the observed issue"></div>
<div class="field"><label for="domain">Domain</label><select id="domain"><option>Supply & Procurement</option><option>Production & Planning</option><option>Quality</option><option>Engineering</option><option>Finance</option><option>People & Organization</option><option>IT & Data</option><option>Other / Not sure</option></select></div>
<div class="field"><label for="urgency">Urgency</label><select id="urgency"><option>Normal</option><option>High</option><option>Critical — immediate review</option></select></div>
<div class="field full"><label for="description">What is observed? *</label><textarea id="description" required placeholder="Facts known so far; root cause is not required."></textarea></div>
<div class="field full"><label for="evidence">Evidence / reference (optional)</label><input id="evidence" placeholder="Document, order, event, or evidence reference"></div>
</div><div class="callout" style="margin-top:14px">This creates an Issue Intake only. Formal Issue Case creation follows qualification. No new reusable Issue Type is created here.</div><div class="formfoot"><button class="btn" type="button" id="cancelIntake">Cancel</button><button class="btn primary" type="submit">Save intake</button></div></form></div></div>
<script>
const caseData={
 intakeId:"INT-118",caseId:"CASE-024",title:"Critical component availability date is unconfirmed",domain:"Supply & Procurement",intakeStatus:"ACCEPTED",caseStatus:"IN REVIEW",reported:"28 Oct 2026 · 09:00",owner:"Project Supply Coordinator",
 description:"Supplier confirmation for a component required by a project production order is pending. No delivery miss or financial loss has yet been verified.",
 evidence:"Latest supplier date confirmation is not yet available.",
 objects:[["PROJECT","PROJECT-T-07"],["PRODUCTION ORDER","DEMO-ORDER-410"],["PURCHASE ORDER","DEMO-PO-882"]],
 candidates:[
 {id:"CAND-024-A",type:"SUP-EXPEDITE-EXISTING-ORDER",title:"Expedite the existing supplier order",feas:"Conditional",feasClass:"bamber",score:64,delivery:4,liquidity:2,risk:3,resource:2,unknown:"Expedite cost and confirmed recovery date",reason:"Strong delivery protection, but supplier date and cost need confirmation."},
 {id:"CAND-024-B",type:"ENG-QUALIFY-ALTERNATE-COMPONENT",title:"Qualify an alternate source/component",feas:"Blocked",feasClass:"bred",score:null,delivery:null,liquidity:null,risk:null,resource:null,unknown:"Technical equivalence, lead time and commercial terms",reason:"Cannot be selected until Engineering and Quality approve the alternate."},
 {id:"CAND-024-C",type:"PLN-RESEQUENCE-WORK",title:"Re-sequence work using available capacity",feas:"Conditional",feasClass:"bgreen",score:78,delivery:3,liquidity:4,risk:2,resource:2,unknown:"Final downstream milestone impact",reason:"Best illustrative fit for liquidity and execution risk, subject to planning confirmation."}
 ],
 decision:{id:"DEC-024-01",selected:"CAND-024-C",profile:"Liquidity Protection · v1",status:"APPROVED",rationale:"Select re-sequencing as the initial response because its assessed liquidity effect is favorable and execution risk is lower in this illustrative comparison. Keep supplier confirmation open; this is not proof that the delivery commitment is protected."},
 actions:[
 {id:"ACT-024-01",title:"Validate and release the approved resequencing plan",owner:"Production Planning",status:"COMPLETED"},
 {id:"ACT-024-02",title:"Obtain written supplier date confirmation and update the case evidence",owner:"Procurement",status:"COMPLETED"}
 ],
 outcome:{id:"OUT-024-01",status:"PARTIALLY EFFECTIVE",liquidity:3,liquidityTarget:2,delivery:3,followup:"Continue monitoring the downstream commitment until the project milestone is verified."}
};
let activePage="home",activeTab="overview",toastTimer;
let demoIntakes=[];
let intakeOpener=null;
let qualificationStatus="ACCEPTED";
let qualificationNote="Sufficiently clear for assessment; actual supply date and downstream impact remain unverified.";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200)}
function button(label,act,cls=""){return '<button class="btn '+cls+'" data-act="'+act+'">'+label+'</button>'}
function disabledButton(label,tip){return '<button class="btn disabled" disabled aria-disabled="true" title="'+esc(tip)+'">'+label+'</button>'}
function badge(label,cls="bgray"){return '<span class="badge '+cls+'">'+label+'</span>'}
function pageHead(kicker,title,sub,actions=""){return '<div class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function stat(label,value,note,ico="blue"){return '<div class="card"><div class="statlabel">'+label+' <span class="dot '+(ico==="green"?"green":ico==="amber"?"amber":ico==="red"?"red":"")+'"></span></div><div class="statvalue">'+value+'</div><div class="statnote">'+note+'</div></div>'}
function intakeQueue(){
 if(!demoIntakes.length)return "";
 return '<section class="card" style="margin:0 0 16px" aria-labelledby="intakeQueueHeading"><div class="cardhead"><h2 id="intakeQueueHeading" tabindex="-1">Session-only intake queue</h2>'+badge(demoIntakes.length+" new intake"+(demoIntakes.length===1?"":"s"),"bblue")+'</div><div class="callout warn" style="margin-bottom:12px">Temporary browser-memory demo state only. These entries disappear when this page is refreshed or closed; they are not saved to a server or durable storage.</div>'+demoIntakes.map(x=>'<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="cardhead" style="margin-bottom:5px"><strong>'+esc(x.id)+' · '+esc(x.title)+'</strong>'+badge(esc(x.status), "bamber")+'</div><div class="small muted">'+esc(x.domain)+' · Urgency: '+esc(x.urgency)+' · '+esc(x.createdAt)+'</div><p style="margin:7px 0">'+esc(x.description)+'</p>'+(x.evidence?'<div class="small muted">Evidence: '+esc(x.evidence)+'</div>':'')+'<div class="small muted" style="margin-top:5px">Intake only — no formal Issue Case created.</div></div>').join("")+'</section>';
}
function timeline(){const items=[["✓","Issue intake captured","INT-118 · Evidence preserved"],["✓","Qualification accepted","CASE-024 created · 28 Oct"],["✓","Candidates assessed","3 options · 1 blocked by hard constraint"],["✓","Decision recorded","DEC-024-01 · Liquidity Protection v1"],["✓","Actions completed","2 actions · owners and evidence recorded"],["↗","Outcome reviewed","Partially effective · follow-up remains"]];return '<div class="timeline">'+items.map(x=>'<div class="step"><div class="stepicon">'+x[0]+'</div><div><strong>'+x[1]+'</strong><p>'+x[2]+'</p></div></div>').join("")+'</div>'}
function home(){return pageHead("Decision workspace","Good afternoon, Manager","One connected view of issues, options, decisions, actions and verified outcomes.",button("＋ New Issue Intake","new-intake","primary"))+
'<div class="grid stats">'+stat("Open Issue Cases","04","Across enterprise domains","blue")+stat("Awaiting qualification","02","Intakes needing review","amber")+stat("Decisions awaiting action","01","Approved · not fully executed","red")+stat("Outcomes to review","03","Evidence or follow-up due","green")+'</div>'+
'<div class="grid twocol"><section class="card"><div class="cardhead"><h2>Priority work queue</h2><button class="btn" data-act="go-issue">View all issues →</button></div><div class="tablewrap"><table><thead><tr><th>Issue</th><th>Domain</th><th>Status</th><th>Owner</th></tr></thead><tbody><tr class="clickrow" data-act="go-issue"><td><span class="link">CASE-024</span><br><span class="muted">'+esc(caseData.title)+'</span></td><td>Supply</td><td>'+badge("In review","bblue")+'</td><td>Project Supply</td></tr><tr class="clickrow" data-act="go-decision"><td><span class="link">CASE-019</span><br><span class="muted">Supplier quality evidence pending</span></td><td>Quality</td><td>'+badge("Awaiting action","bamber")+'</td><td>Quality Lead</td></tr><tr class="clickrow" data-act="go-outcome"><td><span class="link">CASE-011</span><br><span class="muted">Service response time deviation</span></td><td>Shared Services</td><td>'+badge("Outcome due","bgray")+'</td><td>Service Owner</td></tr></tbody></table></div><div class="callout" style="margin-top:16px">Counts and additional queue rows are illustrative UI fixtures. Only CASE-024 has the detailed end-to-end record in this prototype.</div></section><section class="card"><div class="cardhead"><h2>CASE-024 · End-to-end trace</h2>'+badge("Demo record","bgray")+'</div>'+timeline()+'<button class="btn primary" data-act="go-issue" style="width:100%">Open reference case →</button></section></div>'+
'<div class="grid twocol" style="margin-top:16px"><section class="card"><div class="cardhead"><h2>Decision principles</h2><span class="muted small">Always enforced</span></div><div class="grid" style="gap:10px"><div>✓ &nbsp; Feasibility is checked separately from priority.</div><div>✓ &nbsp; Unknown evidence stays unknown; no fabricated impact.</div><div>✓ &nbsp; Decision, action completion and resolution are distinct.</div><div>✓ &nbsp; Outcome uses targets frozen at decision time.</div></div></section><section class="card"><div class="cardhead"><h2>Catalogue authoring</h2>'+badge("MVP scope","bblue")+'</div><p class="muted small">Reusable catalogue creation is deferred. The future actions remain visible in the relevant forms but disabled.</p><div class="actions">'+disabledButton("NEW ISSUE","Available in a future version")+' '+disabledButton("NEW SOLUTION","Available in a future version")+'</div></section></div>'}
function issue(){return pageHead("Issue management","Issue intake & qualification","Capture the observed issue first. Qualification determines whether it enters the formal Issue–Solution chain.",button("＋ New Issue Intake","new-intake","primary"))+
'<div class="tabs"><button class="active" data-tab="overview">Issue detail</button><button data-tab="evidence">Evidence & links</button><button data-tab="qualification">Qualification</button></div>'+intakeQueue()+
(activeTab==="evidence"?'<div class="grid twocol"><section class="card"><div class="cardhead"><h2>Evidence register</h2>'+badge("1 item","bgray")+'</div><div class="callout">OBSERVED · '+esc(caseData.evidence)+'</div><p class="small muted">Evidence can be expanded later to include source, timestamp, owner, confidence and superseding evidence.</p></section><section class="card"><div class="cardhead"><h2>Context links</h2><span class="muted small">Causality not asserted</span></div>'+caseData.objects.map(o=>'<div class="pillrow" style="margin:9px 0"><span class="pill">'+o[0]+'</span><span class="link">'+o[1]+'</span><span class="badge bgray">Context link</span></div>').join("")+'</section></div>':
activeTab==="qualification"?'<div class="grid twocol"><section class="card"><h2 class="sectiontitle">Qualification record</h2><div class="kv"><div><span>Disposition</span><strong>'+(qualificationStatus==="ACCEPTED"?"Accepted":"Information needed")+'</strong></div><div><span>Formal case</span><strong>CASE-024</strong></div><div><span>Review status</span><strong>'+(qualificationStatus==="ACCEPTED"?"In review":"Needs information")+'</strong></div></div><p class="muted small" style="margin-top:15px">Reason: '+esc(qualificationNote)+'</p>'+button("Mark information needed","need-info")+' '+button("Open Solution workspace","go-solution","primary")+'</section><section class="card"><h2 class="sectiontitle">Issue Type</h2><div class="field"><label>Selected catalogue type</label><select><option>Supplier delivery/commitment uncertainty</option><option>Material availability</option><option>Other / classification review</option></select></div><div class="actions" style="margin-top:13px">'+disabledButton("NEW ISSUE","Available in a future version")+'</div><p class="muted small">Unmatched intake remains preserved and routes to classification review.</p></section></div>':

'<div class="card" style="margin-top:16px"><h2 class="sectiontitle">Prototype boundaries</h2><div class="grid" style="gap:10px"><div>✓ Local interactive navigation and sample forms</div><div>✓ Synthetic CASE-024 data</div><div>✓ Visible/disabled catalogue buttons</div><div>— No persistence after browser refresh</div><div>— No user authentication or permission enforcement</div><div>— No live ERP, supplier, email or notification integration</div></div></div>'}
const renderers={home,issue,solution,decision,outcome,settings};
const labels={home:"Home",issue:"Issue",solution:"Solution",decision:"Decision & Actions",outcome:"Outcomes & Learning",settings:"Settings"};
function render(){activePage=renderers[activePage]?activePage:"home";$("#crumb").textContent=labels[activePage];$("#content").innerHTML=renderers[activePage]();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===activePage));document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab))}

$("#content").addEventListener("click",e=>{const tab=e.target.closest("[data-tab]");if(tab){activeTab=tab.dataset.tab;render();return}const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;if(a==="new-intake"){openIntake();return}if(a==="go-issue")return go("issue");if(a==="go-solution")return go("solution");if(a==="go-decision")return go("decision");if(a==="go-outcome")return go("outcome");if(a==="need-info"){qualificationStatus="NEEDS_INFORMATION";qualificationNote="Returned for additional information. This is temporary demo state; no durable record or audit event is created.";activeTab="qualification";render();toast("CASE-024 review status changed to Needs information in temporary demo memory.");return}if(a.startsWith("candidate-")){const c=caseData.candidates.find(x=>x.id===a.slice(10));toast(c.title+" — "+c.reason);return}if(a.startsWith("reassign-")){toast("Prototype only: owner reassignment is not persisted or sent.");return}if(a.startsWith("history-")){toast("Audit history is illustrative in this prototype.");return}if(a==="followup"){toast("Prototype only: follow-up note not persisted.");return}if(a==="close-review"){toast("Review cannot be fully closed while the delivery milestone remains unverified.");return}});
$("#closeModal").addEventListener("click",closeIntake);$("#cancelIntake").addEventListener("click",closeIntake);$("#modalback").addEventListener("click",e=>{if(e.target.id==="modalback")closeIntake()});document.addEventListener("keydown",e=>{const modal=$("#modalback");if(!modal.classList.contains("open"))return;if(e.key==="Escape"){closeIntake();return}if(e.key==="Tab"){const items=modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');if(!items.length){e.preventDefault();return}const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

$("#caseSearch").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const q=e.target.value.trim().toLowerCase();if(!q)return;const hit=demoIntakes.find(x=>(x.id+" "+x.title+" "+x.description).toLowerCase().includes(q));if(hit){go("issue");toast("Matching session-only intake: "+hit.id+". See the temporary intake queue.");return}if(("case-024 "+caseData.title+" "+caseData.description+" "+caseData.domain).toLowerCase().includes(q)){go("issue");toast("Matching detailed synthetic case found: CASE-024.");return}const sampleCases=[{id:"CASE-019",title:"Supplier quality evidence pending"},{id:"CASE-011",title:"Service response time deviation"}];const sampleMatch=sampleCases.find(x=>(x.id+" "+x.title).toLowerCase().includes(q));if(sampleMatch){go("issue");toast("Matching illustrative demo case found: "+sampleMatch.id+". Only CASE-024 has a detailed synthetic record.");return}toast("No matching visible demo record. Search is local to this prototype; no server search is performed.");});

<script id="mang03-decision-guardrails">
(() => {
  const root = document.querySelector("#content");
  if (!root) return;
  const state = {
    alternatives: {
      "CAND-024-A": {status:"RETAINED", reason:"Expedite cost and recovery date remain unconfirmed.", trigger:"Reopen when the supplier provides a dated commitment and a costed expedite offer."},
      "CAND-024-B": {status:"DEFERRED — HARD GATE", reason:"Engineering and Quality approval is not evidenced.", trigger:"Reopen only after documented technical equivalence and Engineering + Quality approval."}
    },
    abstained: false, abstainReason: "", emergencyActions: [], valueEvaluation: null
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const card = (id,title,body) => '<section class="card" data-guardrail-panel="'+id+'" style="margin-top:16px"><div class="cardhead"><h2>'+title+'</h2><span class="badge bblue">Decision safeguard</span></div>'+body+'</section>';
  function decisionPanel(){
    const rows = Object.entries(state.alternatives).map(([id,a]) => '<div style="padding:13px 0;border-bottom:1px solid var(--line)" data-alt-row="'+id+'"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong>'+id+' · '+(id.endsWith("-A")?"Expedite supplier order":"Qualify alternate source")+'</strong><span class="badge '+(a.status.startsWith("REOPEN")?"bgreen":id.endsWith("-B")?"bred":"bamber")+'" data-alt-status="'+id+'">'+esc(a.status)+'</span></div><p class="small muted" style="margin:7px 0">'+esc(a.reason)+'</p><div class="callout">'+esc(a.trigger)+'</div><div class="actions" style="margin-top:9px"><button class="btn" type="button" data-g3-action="toggle-alt" data-alt-id="'+id+'">'+(a.status.startsWith("REOPEN")?"Clear reconsideration flag":"Flag for reconsideration")+'</button></div></div>').join("");
    return card("alternatives-ledger","Rejected / deferred alternatives ledger",'<p class="muted small">Alternatives are retained with the reason and a concrete reopening trigger. A changed condition prompts reassessment; it does not silently replace the recorded decision.</p>'+rows+'<div class="callout warn" style="margin-top:12px">Session-only prototype state. A production service must preserve immutable decision versions, evidence and reconsideration events in durable audit history.</div>');
  }
  function solutionPanel(){
    const banner = state.abstained ? '<div class="callout warn" data-abstain-state="withheld" style="margin-bottom:12px"><strong>Recommendation withheld for this session.</strong><br>Reason: '+esc(state.abstainReason)+'. The fixture’s displayed selection is synthetic and must not be treated as a current recommendation.</div>' : '<div class="callout" data-abstain-state="available" style="margin-bottom:12px">A recommendation is not mandatory. Withhold it when evidence is stale, a hard constraint is unresolved, or no candidate is feasible.</div>';
    const actionRows = state.emergencyActions.map((a,i)=>'<div class="callout" style="margin-top:9px"><strong>Emergency proposal '+(i+1)+': '+esc(a.title)+'</strong><br>Owner: '+esc(a.owner)+' · Expires: '+esc(a.expiresAt)+'<br>Reversible: Yes · Review required: Yes<br><span class="small">Recorded in this browser session only; not approved or executed.</span></div>').join("");
    return card("abstain-emergency","Recommendation abstention & emergency path",banner+
      '<div class="fieldgrid"><div class="field"><label for="g3-abstain-reason">Why should recommendation be withheld?</label><select id="g3-abstain-reason"><option value="">Choose a reason</option><option>Evidence stale or source unavailable</option><option>Hard constraint unresolved</option><option>No feasible candidate</option><option>Conflicting evidence or material unknown</option></select></div><div class="field"><label for="g3-evidence-note">Evidence / gate note</label><input id="g3-evidence-note" placeholder="Source, timestamp, constraint, or unknown"></div></div><div class="actions" style="margin-top:10px"><button class="btn" type="button" data-g3-action="abstain">Withhold recommendation</button><button class="btn" type="button" data-g3-action="clear-abstain">Clear session hold</button></div>'+
      '<div class="divider" style="height:1px;background:var(--line);margin:18px 0"></div><h3 class="sectiontitle">Emergency reversible action proposal</h3><p class="muted small">For time-critical containment only: require an accountable owner, explicit expiry, reversibility and review. This prototype records a proposal only; it does not authorize or execute work.</p>'+
      '<form id="g3-emergency-form"><div class="fieldgrid"><div class="field"><label for="g3-emergency-title">Proposed action *</label><input id="g3-emergency-title" required placeholder="Containment action"></div><div class="field"><label for="g3-emergency-owner">Accountable owner *</label><input id="g3-emergency-owner" required placeholder="Role / named owner"></div><div class="field"><label for="g3-emergency-expiry">Expiry / review deadline *</label><input id="g3-emergency-expiry" type="datetime-local" required></div><div class="field"><label>Control</label><label style="display:flex;align-items:center;gap:8px"><input id="g3-emergency-reversible" type="checkbox" required style="width:auto"> Action is reversible and reviewable</label></div></div><div class="formfoot"><button class="btn primary" type="submit">Record emergency proposal</button></div></form>'+actionRows+
      '<div class="callout warn" style="margin-top:12px">Emergency path is not a bypass for safety, legal, technical or delegated-authority gates. Production must define who can authorize it and how expiry/review is enforced.</div>');
  }
  function outcomePanel(){
    const saved = state.valueEvaluation ? '<div class="callout" data-value-result="saved" style="margin-top:12px"><strong>Evaluation captured (session-only)</strong><br>Baseline: '+esc(state.valueEvaluation.baseline)+'<br>Changed decision: '+esc(state.valueEvaluation.changedDecision)+'<br>Observed outcome: '+esc(state.valueEvaluation.observedOutcome)+'<br>Attribution: '+esc(state.valueEvaluation.attribution)+'<br><span class="small">Association or timing alone is not causal proof; preserve the comparison method and competing explanations.</span></div>' : '';
    return card("value-proof","Decision change & value proof ledger",'<p class="muted small">Measure whether the service changed a decision and what was observed against a defensible baseline. Do not use issue count, closure, or product usage as a proxy for value.</p>'+
      '<form id="g3-value-form"><div class="fieldgrid"><div class="field full"><label for="g3-baseline">Baseline / counterfactual *</label><textarea id="g3-baseline" required placeholder="What would likely have happened without this decision support? State source and comparison period."></textarea></div><div class="field full"><label for="g3-changed-decision">Decision changed because of review *</label><textarea id="g3-changed-decision" required placeholder="Original option, changed option, decision-maker, and why. Use “no material change” if applicable."></textarea></div><div class="field full"><label for="g3-observed-outcome">Observed outcome + evidence *</label><textarea id="g3-observed-outcome" required placeholder="Observed result, measurement window, evidence source, and uncertainty."></textarea></div><div class="field"><label for="g3-attribution">Attribution status</label><select id="g3-attribution"><option>Not established</option><option>Plausible contribution — alternatives remain</option><option>Independently supported with comparison</option></select></div><div class="field"><label for="g3-measurement-window">Measurement window</label><input id="g3-measurement-window" placeholder="e.g., 30 days after action"></div></div><div class="formfoot"><button class="btn primary" type="submit">Record value evaluation</button></div></form>'+saved+
      '<div class="kv" style="margin-top:14px"><div><span>Primary signal</span><strong>Decision changed / not changed</strong></div><div><span>Outcome signal</span><strong>Observed vs baseline</strong></div><div><span>Attribution guard</span><strong>No causal claim by default</strong></div></div>');
  }
  function enhance(){
    if (!root.isConnected) return;
    const crumb = document.querySelector("#crumb")?.textContent || "";
    if (crumb.includes("Decision") && !root.querySelector('[data-guardrail-panel="alternatives-ledger"]')) root.insertAdjacentHTML("beforeend",decisionPanel());
    if (crumb.includes("Solution") && !root.querySelector('[data-guardrail-panel="abstain-emergency"]')) root.insertAdjacentHTML("beforeend",solutionPanel());
    if (crumb.includes("Outcomes") && !root.querySelector('[data-guardrail-panel="value-proof"]')) root.insertAdjacentHTML("beforeend",outcomePanel());
    const hold = root.querySelector('[data-abstain-state="withheld"]');
    const clear = root.querySelector('[data-abstain-state="available"]');
    if (hold) {
      root.querySelectorAll(".candidate").forEach(el=>el.classList.remove("selected"));
      root.querySelectorAll(".candidate .candbottom .btn").forEach(el=>{if(el.textContent.includes("Selected"))el.textContent="Fixture selection (not recommendation)";});
    } else if (crumb.includes("Solution")) {
      root.querySelectorAll(".candidate").forEach(el=>{if(el.innerText.includes("CAND-024-C")){el.classList.add("selected");const btn=el.querySelector(".candbottom .btn");if(btn)btn.textContent="Selected ✓";}});
    }
    const oldNotice=root.querySelector('[data-current-session-hold="true"]');
    if (state.abstained && crumb.includes("Decision") && !oldNotice) {
      const n=document.createElement("div");n.className="callout warn";n.dataset.currentSessionHold="true";n.style.marginBottom="16px";n.innerHTML="<strong>Current-session abstention guard is active.</strong> The synthetic approved decision below is fixture data, not an actionable recommendation while the hold is active.";
      const first=root.querySelector('[data-guardrail-panel="alternatives-ledger"]'); if(first) root.insertBefore(n,first);
    } else if (!state.abstained && oldNotice) oldNotice.remove();
  }
  document.addEventListener("click", e=>{
    const b=e.target.closest("[data-g3-action]"); if(!b)return;
    const act=b.dataset.g3Action;
    if(act==="toggle-alt"){
      const id=b.dataset.altId, a=state.alternatives[id]; if(!a)return;
      a.status=a.status.startsWith("REOPEN")?(id.endsWith("-B")?"DEFERRED — HARD GATE":"RETAINED"):"REOPEN WHEN TRIGGER MET";
      const row=root.querySelector('[data-alt-row="'+id+'"]'); if(row){const s=row.querySelector("[data-alt-status]");s.textContent=a.status;s.className="badge "+(a.status.startsWith("REOPEN")?"bgreen":id.endsWith("-B")?"bred":"bamber");b.textContent=a.status.startsWith("REOPEN")?"Clear reconsideration flag":"Flag for reconsideration";}
      return;
    }
    if(act==="abstain"){
      const reason=root.querySelector("#g3-abstain-reason")?.value;
      if(!reason){alert("Choose a reason before withholding a recommendation.");return;}
      state.abstained=true;state.abstainReason=reason;
      const panel=root.querySelector('[data-guardrail-panel="abstain-emergency"]'); if(panel) panel.outerHTML=solutionPanel();
      enhance(); return;
    }
    if(act==="clear-abstain"){state.abstained=false;state.abstainReason="";const panel=root.querySelector('[data-guardrail-panel="abstain-emergency"]');if(panel)panel.outerHTML=solutionPanel();enhance();return;}
  });
  document.addEventListener("submit",e=>{
    if(e.target.id==="g3-emergency-form"){
      e.preventDefault();const title=root.querySelector("#g3-emergency-title").value.trim(),owner=root.querySelector("#g3-emergency-owner").value.trim(),expiry=root.querySelector("#g3-emergency-expiry").value,reversible=root.querySelector("#g3-emergency-reversible").checked;
      if(!title||!owner||!expiry||!reversible){alert("Action, owner, expiry and reversibility confirmation are required.");return;}
      if(new Date(expiry).getTime()<=Date.now()){alert("Expiry / review deadline must be in the future.");return;}
      state.emergencyActions.push({title,owner,expiresAt:expiry});
      const panel=root.querySelector('[data-guardrail-panel="abstain-emergency"]');if(panel)panel.outerHTML=solutionPanel();enhance();return;
    }
    if(e.target.id==="g3-value-form"){
      e.preventDefault();const baseline=root.querySelector("#g3-baseline").value.trim(),changedDecision=root.querySelector("#g3-changed-decision").value.trim(),observedOutcome=root.querySelector("#g3-observed-outcome").value.trim();
      if(!baseline||!changedDecision||!observedOutcome){alert("Baseline, changed decision and observed outcome are required.");return;}
      state.valueEvaluation={baseline,changedDecision,observedOutcome,attribution:root.querySelector("#g3-attribution").value,window:root.querySelector("#g3-measurement-window").value.trim()};
      const panel=root.querySelector('[data-guardrail-panel="value-proof"]');if(panel)panel.outerHTML=outcomePanel();enhance();return;
    }
  });
  const observer = new MutationObserver(() => enhance());
  observer.observe(root,{childList:true,subtree:false});
  enhance();
  window.__MANG03_GUARDRAILS_TEST_STATE__ = state;
})();
</script>
